[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-face"
version = "1.1.0"
description = "AURA-Face: Edge Facial Behavior Analysis for Astronaut Multimodal Digital Twin (ASI BEX2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AURA Crew", email = "dacforplay@gmail.com"}
]
keywords = ["spaceflight", "astronaut", "perclos", "ear", "facs", "mediapipe", "digital-twin", "bex2026"]
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "numpy>=1.23.0",
    "matplotlib>=3.6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
aura-face = "aura_face.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
